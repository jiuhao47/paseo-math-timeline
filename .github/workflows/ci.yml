name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install CJK rendering font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Build generated runtime assets
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Compile smoke test
        run: npm run smoke

      - name: Browser smoke test
        run: npm run smoke:browser

      - name: Audit dependencies
        run: npm audit --audit-level=high
